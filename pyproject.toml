[project]
name = "japan-company-handbook"
version = "0.1.0"
description = "会社四季報オンラインの誌面アーカイブPDF一括保存ツール"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50,<2",
    "httpx>=0.28,<1",
    "cryptography>=45.0,<46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
shikiho = "scrape.shikiho_cli:main"
scrape = "scrape.legacy_cli:main_scrape"
invert-pdfs = "pdfops.__main__:main"
scrape-magazine = "scrape.legacy_cli:main_scrape_magazine_issue"
scrape-magazine-all = "scrape.legacy_cli:main_scrape_magazine_all"
scrape-magazine-verify = "scrape.legacy_cli:main_scrape_magazine_verify"
scrape-magazine-audit = "scrape.legacy_cli:main_scrape_magazine_audit"

[tool.hatch.build.targets.wheel]
packages = ["scrape", "pdfops"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
]
